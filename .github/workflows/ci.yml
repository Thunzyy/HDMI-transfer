name: CI

on:
  push:
    branches:
      - main
      - refactor/**
  pull_request:

jobs:
  quality-gate:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run quality gate
        shell: pwsh
        run: |
          ./tools/run_quality_gate.ps1 -SkipNativeLoopback
