name: Feature Idea
description: Proposer une feature sans la mettre automatiquement en TODO
title: "[Feature Idea] "
labels: ["type:idea", "status:proposed", "priority:P3"]
body:
  - type: markdown
    attributes:
      value: |
        Cette issue est une **proposition**, pas une tâche de dev validée.
        Attendre la validation du mainteneur avant de commencer le développement.
  - type: textarea
    id: summary
    attributes:
      label: Résumé
      description: Décris l'idée en une phrase.
      placeholder: Ajouter un profil de transfert personnalisé.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problème / opportunité
      description: Quel problème ça résout ? Pourquoi c'est utile ?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposition
      description: Comment la feature pourrait fonctionner ?
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact estimé
      options: [Critique, Haut, Moyen, Faible, Nice-to-have]
    validations:
      required: true
  - type: dropdown
    id: complexity
    attributes:
      label: Complexité estimée
      options: [XS, S, M, L, XL]
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risques / questions ouvertes
      placeholder: Données manquantes, dette technique, UX à clarifier...
  - type: checkboxes
    id: approval_rule
    attributes:
      label: Validation préalable
      options:
        - label: Je confirme que cette idée ne doit pas être codée tant qu'elle n'est pas validée par le mainteneur.
          required: true
