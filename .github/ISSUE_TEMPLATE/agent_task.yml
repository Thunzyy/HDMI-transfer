name: Agent Task
description: Tâche explicite pour un agent Hermes
title: "[Agent Task] "
labels: ["type:task"]
body:
  - type: textarea
    id: mission
    attributes:
      label: Mission
      description: Résultat attendu, formulé comme une tâche concrète.
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent recommandé
      options:
        - dan-orchestrateur
        - productowner
        - techlead
        - developper
        - verifier
        - scribe
        - devopsrelease
        - swarm
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Contexte obligatoire
      description: Fichiers, liens, décisions, contraintes, dépendances.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Definition of Done
      value: |
        - [ ] Travail réalisé
        - [ ] Tests/build/lint pertinents passés
        - [ ] Preuves ajoutées en commentaire ou PR
        - [ ] Handoff clair pour Dan/Lucas
    validations:
      required: true
  - type: textarea
    id: forbidden
    attributes:
      label: Hors-scope / interdits
      description: Ce que l'agent ne doit pas faire.
