name: Research / Spike
description: Research before a decision or implementation
title: "[Research] "
labels: ["type:research"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question to answer
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints / expected sources
  - type: textarea
    id: output
    attributes:
      label: Expected deliverable
      value: |
        - [ ] Decision summary
        - [ ] Options compared
        - [ ] Recommendation
        - [ ] Sources/links
    validations:
      required: true
