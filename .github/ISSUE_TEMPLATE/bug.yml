name: Bug
description: Bug ou régression à corriger
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Étapes de reproduction
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Résultat attendu
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Résultat actuel
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs / captures / contexte
  - type: dropdown
    id: priority
    attributes:
      label: Priorité
      options: [P0, P1, P2, P3]
