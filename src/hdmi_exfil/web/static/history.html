<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>HDMI Exfil — History</title>
<style>
:root {
  --bg:#16181e; --bg2:#0f1117;
  --accent:#7c8aff; --accent-dim:rgba(124,138,255,0.1);
  --accent-border:rgba(255,255,255,0.1);
  --green:#4ade80; --yellow:#fbbf24; --red:#f87171;
  --text:#e4e4e7; --bright:#ffffff; --muted:#a1a1aa;
  --font-ui:'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'SF Mono','Cascadia Code','Fira Code','Consolas',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100vh;overflow:hidden;
  background:var(--bg2);color:var(--text);
  font-family:var(--font-ui);
  font-size:14px;display:flex;flex-direction:column;
}
::selection{background:var(--accent);color:var(--bg2)}

#header{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;height:44px;
  background:var(--bg);border-bottom:1px solid var(--accent-border);
  flex-shrink:0;
}
.h-left{display:flex;align-items:center;gap:10px}
.h-title{color:var(--bright);font-size:15px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}

#layout{flex:1;display:flex;overflow:hidden}

#sidebar{
  width:220px;border-right:1px solid var(--accent-border);
  background:var(--bg);display:flex;flex-direction:column;
  flex-shrink:0;
}
.nav{padding:16px 12px;display:flex;flex-direction:column;gap:2px}
.nav a{
  display:block;padding:10px 14px;border-radius:6px;
  color:var(--muted);text-decoration:none;
  font-size:13px;font-weight:500;text-transform:uppercase;
  letter-spacing:1px;transition:all .15s;
}
.nav a:hover{color:var(--text);background:rgba(255,255,255,0.04)}
.nav a.active{color:var(--bright);background:rgba(255,255,255,0.07);font-weight:700}
.sidebar-ver{
  padding:12px 16px;font-size:11px;color:var(--muted);
  letter-spacing:1px;opacity:.6;margin-top:auto;
}

#center{flex:1;display:flex;flex-direction:column;overflow:hidden}

.center-top{
  padding:14px 20px 10px;
  display:flex;justify-content:space-between;align-items:center;
}
.center-top h2{
  font-size:16px;font-weight:700;color:var(--bright);
  text-transform:uppercase;letter-spacing:.5px;
}
.center-top .sub{font-size:12px;color:var(--muted);margin-top:3px}
.btn-clear{
  padding:8px 16px;border-radius:5px;
  font-family:inherit;font-size:12px;font-weight:700;
  text-transform:uppercase;letter-spacing:.8px;
  cursor:pointer;transition:all .15s;
  background:transparent;border:1px solid rgba(255,255,255,0.15);
  color:var(--text);
}
.btn-clear:hover{border-color:var(--red);color:var(--red)}

.table-wrap{
  flex:1;overflow-y:auto;padding:0 20px 20px;
}
table{
  width:100%;border-collapse:collapse;
}
thead th{
  position:sticky;top:0;
  background:var(--bg2);
  padding:10px 12px;text-align:left;
  font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:1.5px;color:var(--muted);
  border-bottom:1px solid var(--accent-border);
}
tbody td{
  padding:10px 12px;
  border-bottom:1px solid rgba(255,255,255,0.06);
  font-size:13px;color:var(--text);
  white-space:nowrap;font-family:var(--font-mono);
}
tbody tr:hover{background:rgba(255,255,255,0.02)}
.tag{
  display:inline-block;padding:3px 10px;border-radius:4px;
  font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:.5px;font-family:var(--font-ui);
}
.tag-sent{background:rgba(124,138,255,0.15);color:var(--accent)}
.tag-received{background:rgba(74,222,128,0.15);color:var(--green)}
.tag-ok{color:var(--green)}
.tag-fail{color:var(--red)}

.empty-state{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  color:var(--muted);gap:8px;
}
.empty-state p{font-size:14px;text-transform:uppercase;letter-spacing:2px}
.empty-state .sub{font-size:12px;letter-spacing:1px;opacity:.7}
</style>
</head>
<body>

<div id="header">
  <div class="h-left">
    <span class="h-title">HDMI Exfil</span>
  </div>
</div>

<div id="layout">
  <aside id="sidebar">
    <nav class="nav">
      <a href="/">Receive</a>
      <a href="/sender">Send</a>
      <a class="active" href="/history">History</a>
    </nav>
    <div class="sidebar-ver">v0.1.0</div>
  </aside>

  <main id="center">
    <div class="center-top">
      <div>
        <h2>Transfer history</h2>
        <div class="sub" id="countLabel">No transfers recorded</div>
      </div>
      <button class="btn-clear" id="clearBtn">Clear all</button>
    </div>

    <div class="table-wrap" id="tableWrap">
      <table id="historyTable" style="display:none">
        <thead>
          <tr>
            <th>Date</th>
            <th>Type</th>
            <th>File</th>
            <th>Size</th>
            <th>Duration</th>
            <th>Speed</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="historyBody"></tbody>
      </table>

      <div class="empty-state" id="emptyState">
        <p>No history yet</p>
        <div class="sub">Completed transfers will appear here</div>
      </div>
    </div>
  </main>
</div>

<script>
(() => {
  const STORAGE_KEY = 'hdmi_exfil_history';
  const tbody = document.getElementById('historyBody');
  const table = document.getElementById('historyTable');
  const emptyState = document.getElementById('emptyState');
  const countLabel = document.getElementById('countLabel');
  const clearBtn = document.getElementById('clearBtn');

  function getHistory() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    } catch { return []; }
  }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1048576).toFixed(2) + ' MB';
  }

  function formatDuration(s) {
    if (s == null) return '--';
    if (s < 60) return s.toFixed(1) + 's';
    const m = Math.floor(s / 60);
    return m + 'm ' + (s % 60).toFixed(0) + 's';
  }

  function formatSpeed(bps) {
    if (bps == null) return '--';
    if (bps < 1024) return bps.toFixed(0) + ' B/s';
    if (bps < 1048576) return (bps / 1024).toFixed(1) + ' KB/s';
    return (bps / 1048576).toFixed(2) + ' MB/s';
  }

  function render() {
    const items = getHistory();
    tbody.innerHTML = '';

    if (items.length === 0) {
      table.style.display = 'none';
      emptyState.style.display = '';
      countLabel.textContent = 'No transfers recorded';
      return;
    }

    table.style.display = '';
    emptyState.style.display = 'none';
    countLabel.textContent = items.length + ' transfer' + (items.length !== 1 ? 's' : '');

    // Most recent first
    const sorted = [...items].reverse();
    for (const item of sorted) {
      const tr = document.createElement('tr');
      const date = new Date(item.timestamp);
      const dateStr = date.toLocaleDateString('en-US', {
        month: 'short', day: 'numeric', year: 'numeric'
      }) + ' ' + date.toLocaleTimeString('en-US', {
        hour: '2-digit', minute: '2-digit', hour12: false
      });

      const typeClass = item.type === 'sent' ? 'tag-sent' : 'tag-received';
      const statusClass = item.success ? 'tag-ok' : 'tag-fail';

      tr.innerHTML = `
        <td>${dateStr}</td>
        <td><span class="tag ${typeClass}">${item.type}</span></td>
        <td>${item.filename || '--'}</td>
        <td>${item.size != null ? formatSize(item.size) : '--'}</td>
        <td>${formatDuration(item.duration)}</td>
        <td>${formatSpeed(item.speed)}</td>
        <td class="${statusClass}">${item.success ? 'OK' : 'Failed'}</td>
      `;
      tbody.appendChild(tr);
    }
  }

  clearBtn.addEventListener('click', () => {
    localStorage.removeItem(STORAGE_KEY);
    render();
  });

  // Listen for storage events from other tabs (sender/receiver)
  window.addEventListener('storage', (e) => {
    if (e.key === STORAGE_KEY) render();
  });

  render();
})();
</script>
</body>
</html>
