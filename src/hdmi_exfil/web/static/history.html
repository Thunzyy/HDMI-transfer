<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>HDMI Exfil — History</title>
<style>
:root {
  --bg:#16181e; --bg2:#0f1117;
  --accent:#7c8aff; --accent-dim:rgba(124,138,255,0.1);
  --accent-border:rgba(255,255,255,0.1);
  --green:#4ade80; --yellow:#fbbf24; --red:#f87171;
  --text:#e4e4e7; --bright:#ffffff; --muted:#a1a1aa;
  --font-ui:'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'SF Mono','Cascadia Code','Fira Code','Consolas',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100vh;overflow:hidden;
  background:var(--bg2);color:var(--text);
  font-family:var(--font-ui);
  font-size:14px;display:flex;flex-direction:column;
}
::selection{background:var(--accent);color:var(--bg2)}

#header{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;height:44px;
  background:var(--bg);border-bottom:1px solid var(--accent-border);
  flex-shrink:0;
}
.h-left{display:flex;align-items:center;gap:10px}
.h-title{color:var(--bright);font-size:15px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}

#layout{flex:1;display:flex;overflow:hidden}

#sidebar{
  width:220px;border-right:1px solid var(--accent-border);
  background:var(--bg);display:flex;flex-direction:column;
  flex-shrink:0;
}
.nav{padding:16px 12px;display:flex;flex-direction:column;gap:2px}
.nav a{
  display:block;padding:10px 14px;border-radius:6px;
  color:var(--muted);text-decoration:none;
  font-size:13px;font-weight:500;text-transform:uppercase;
  letter-spacing:1px;transition:all .15s;
}
.nav a:hover{color:var(--text);background:rgba(255,255,255,0.04)}
.nav a.active{color:var(--bright);background:rgba(255,255,255,0.07);font-weight:700}
.sidebar-ver{
  padding:12px 16px;font-size:11px;color:var(--muted);
  letter-spacing:1px;opacity:.6;margin-top:auto;
}

#center{flex:1;display:flex;flex-direction:column;overflow:hidden}

.center-top{
  padding:14px 20px 10px;
  display:flex;justify-content:space-between;align-items:center;
  gap:16px;
}
.center-top h2{
  font-size:16px;font-weight:700;color:var(--bright);
  text-transform:uppercase;letter-spacing:.5px;
}
.title-copy{min-width:0}
.center-top .sub{font-size:12px;color:var(--muted);margin-top:3px}
.center-top .sub.error{color:var(--red)}
.top-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}
.btn-clear{
  padding:8px 16px;border-radius:5px;
  font-family:inherit;font-size:12px;font-weight:700;
  text-transform:uppercase;letter-spacing:.8px;
  cursor:pointer;transition:all .15s;
  background:transparent;border:1px solid rgba(255,255,255,0.15);
  color:var(--text);
}
.btn-clear:hover{border-color:var(--red);color:var(--red)}

.table-wrap{
  flex:1;overflow-y:auto;padding:0 20px 20px;
}
table{
  width:100%;border-collapse:collapse;
}
thead th{
  position:sticky;top:0;
  background:var(--bg2);
  padding:10px 12px;text-align:left;
  font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:1.5px;color:var(--muted);
  border-bottom:1px solid var(--accent-border);
}
tbody td{
  padding:10px 12px;
  border-bottom:1px solid rgba(255,255,255,0.06);
  font-size:13px;color:var(--text);
  white-space:nowrap;font-family:var(--font-mono);
}
tbody tr:hover{background:rgba(255,255,255,0.02)}
.tag{
  display:inline-block;padding:3px 10px;border-radius:4px;
  font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:.5px;font-family:var(--font-ui);
}
.tag-sent{background:rgba(124,138,255,0.15);color:var(--accent)}
.tag-received{background:rgba(74,222,128,0.15);color:var(--green)}
.status-badge{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:76px;padding:4px 10px;border-radius:999px;
  font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:.8px;font-family:var(--font-ui);
}
.status-disk{background:rgba(124,138,255,0.14);color:var(--accent)}
.status-ok{background:rgba(74,222,128,0.14);color:var(--green)}
.status-fail{background:rgba(248,113,113,0.14);color:var(--red)}
.status-missing{background:rgba(251,191,36,0.14);color:var(--yellow)}
.cell-primary{
  color:var(--bright);font-family:var(--font-ui);
  font-size:13px;font-weight:600;word-break:break-word;
}
.cell-sub{
  margin-top:4px;color:var(--muted);
  font-size:11px;font-family:var(--font-ui);
  letter-spacing:.2px;
}
.path-cell{
  white-space:normal;min-width:320px;max-width:560px;
}
.path-text{
  word-break:break-all;line-height:1.45;
}
.path-text.dim{color:var(--muted);font-family:var(--font-ui)}
.row-actions{
  display:flex;align-items:center;justify-content:flex-end;gap:8px;
}
.row-btn{
  padding:6px 10px;border-radius:5px;
  border:1px solid rgba(255,255,255,0.12);
  background:transparent;color:var(--text);
  font-family:inherit;font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:.7px;
  cursor:pointer;transition:all .15s;
}
.row-btn:hover{border-color:rgba(255,255,255,0.26);color:var(--bright)}
.row-btn-open:hover{border-color:var(--accent);color:var(--accent)}
.row-btn-danger:hover{border-color:var(--red);color:var(--red)}
.row-btn:disabled{opacity:.35;cursor:not-allowed}

.modal-backdrop{
  position:fixed;inset:0;z-index:50;
  display:flex;align-items:center;justify-content:center;
  padding:20px;background:rgba(4,8,16,0.72);
  backdrop-filter:blur(8px);
}
.modal-backdrop.hidden{display:none}
.modal-dialog{
  width:min(460px, calc(100vw - 40px));
  padding:20px;border-radius:10px;
  background:linear-gradient(180deg, rgba(28,31,40,0.98), rgba(17,19,26,0.98));
  border:1px solid rgba(255,255,255,0.12);
  box-shadow:0 24px 70px rgba(0,0,0,0.42);
}
.modal-title{
  color:var(--bright);font-size:16px;font-weight:700;
  letter-spacing:.3px;text-transform:uppercase;
}
.modal-body{
  margin-top:10px;color:var(--text);font-size:13px;
  line-height:1.65;word-break:break-word;
}
.modal-actions{
  margin-top:18px;display:flex;justify-content:flex-end;gap:8px;
}
.modal-btn{
  min-width:108px;padding:9px 14px;border-radius:6px;
  border:1px solid rgba(255,255,255,0.12);
  background:transparent;color:var(--text);
  font-family:inherit;font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:.8px;
  cursor:pointer;transition:all .15s;
}
.modal-btn:hover{border-color:rgba(255,255,255,0.26);color:var(--bright)}
.modal-btn-confirm{
  background:rgba(248,113,113,0.12);border-color:rgba(248,113,113,0.4);color:var(--red);
}
.modal-btn-confirm:hover{background:rgba(248,113,113,0.18);border-color:var(--red);color:#ffb3b3}

.empty-state{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  color:var(--muted);gap:8px;
}
.empty-state p{font-size:14px;text-transform:uppercase;letter-spacing:2px}
.empty-state .sub{font-size:12px;letter-spacing:1px;opacity:.7}
</style>
</head>
<body>

<div id="header">
  <div class="h-left">
    <span class="h-title">HDMI Exfil</span>
  </div>
</div>

<div id="layout">
  <aside id="sidebar">
    <nav class="nav">
      <a href="/">Receive</a>
      <a href="/sender">Send</a>
      <a href="/history">History</a>
      <a href="/settings">Settings</a>
    </nav>
    <div class="sidebar-ver">v0.1.0</div>
  </aside>

  <main id="center">
    <div class="center-top">
      <div class="title-copy">
        <h2>Transfer history</h2>
        <div class="sub" id="countLabel">No transfers recorded</div>
        <div class="sub" id="noticeLabel"></div>
      </div>
      <div class="top-actions">
        <button class="btn-clear" id="clearBtn">Clear all</button>
      </div>
    </div>

    <div class="table-wrap" id="tableWrap">
      <table id="historyTable" style="display:none">
        <thead>
          <tr>
            <th>Date</th>
            <th>Type</th>
            <th>File</th>
            <th>Location</th>
            <th>Size</th>
            <th>Duration</th>
            <th>Speed</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="historyBody"></tbody>
      </table>

      <div class="empty-state" id="emptyState">
        <p>No history yet</p>
        <div class="sub">Completed transfers will appear here</div>
      </div>
    </div>
  </main>
</div>

<div class="modal-backdrop hidden" id="confirmModal" aria-hidden="true">
  <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="confirmModalTitle">
    <div class="modal-title" id="confirmModalTitle">Confirm action</div>
    <div class="modal-body" id="confirmModalMessage"></div>
    <div class="modal-actions">
      <button class="modal-btn" id="confirmModalCancel" type="button">Cancel</button>
      <button class="modal-btn modal-btn-confirm" id="confirmModalConfirm" type="button">Confirm</button>
    </div>
  </div>
</div>

<script>
(() => {
  const STORAGE_KEY = 'hdmi_exfil_history';
  const tbody = document.getElementById('historyBody');
  const table = document.getElementById('historyTable');
  const emptyState = document.getElementById('emptyState');
  const countLabel = document.getElementById('countLabel');
  const noticeLabel = document.getElementById('noticeLabel');
  const clearBtn = document.getElementById('clearBtn');
  const confirmModal = document.getElementById('confirmModal');
  const confirmModalTitle = document.getElementById('confirmModalTitle');
  const confirmModalMessage = document.getElementById('confirmModalMessage');
  const confirmModalCancel = document.getElementById('confirmModalCancel');
  const confirmModalConfirm = document.getElementById('confirmModalConfirm');
  let confirmState = null;
  let serverFiles = [];
  let serverFilesRequest = null;
  let viewItems = [];

  function getHistory() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    } catch { return []; }
  }

  function setHistory(items) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }

  function formatSize(bytes) {
    if (bytes == null || !Number.isFinite(Number(bytes))) return '--';
    bytes = Number(bytes);
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1048576).toFixed(2) + ' MB';
  }

  function formatDuration(s) {
    if (s == null) return '--';
    s = Number(s);
    if (s < 60) return s.toFixed(1) + 's';
    const m = Math.floor(s / 60);
    return m + 'm ' + (s % 60).toFixed(0) + 's';
  }

  function formatSpeed(bps) {
    if (bps == null) return '--';
    bps = Number(bps);
    if (bps < 1024) return bps.toFixed(0) + ' B/s';
    if (bps < 1048576) return (bps / 1024).toFixed(1) + ' KB/s';
    return (bps / 1048576).toFixed(2) + ' MB/s';
  }

  function escapeHtml(value) {
    return String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#39;');
  }

  function setNotice(message, isError = false) {
    noticeLabel.textContent = message || '';
    noticeLabel.className = 'sub' + (isError ? ' error' : '');
  }

  function closeConfirmModal(confirmed) {
    if (!confirmState) return;
    const { resolve, previousFocus } = confirmState;
    confirmState = null;
    confirmModal.classList.add('hidden');
    confirmModal.setAttribute('aria-hidden', 'true');
    confirmModalConfirm.textContent = 'Confirm';
    confirmModalTitle.textContent = 'Confirm action';
    confirmModalMessage.textContent = '';
    if (previousFocus && typeof previousFocus.focus === 'function') {
      previousFocus.focus();
    }
    resolve(Boolean(confirmed));
  }

  function showConfirmModal({ title, message, confirmLabel }) {
    if (confirmState) {
      closeConfirmModal(false);
    }
    confirmModalTitle.textContent = title;
    confirmModalMessage.textContent = message;
    confirmModalConfirm.textContent = confirmLabel || 'Confirm';
    confirmModal.classList.remove('hidden');
    confirmModal.setAttribute('aria-hidden', 'false');

    return new Promise((resolve) => {
      confirmState = {
        resolve,
        previousFocus: document.activeElement,
      };
      window.requestAnimationFrame(() => confirmModalConfirm.focus());
    });
  }

  function statusFor(item) {
    if (item.type === 'received' && item.fileExists === false) {
      return { label: 'Missing', className: 'status-missing' };
    }
    if (item.imported && item.success == null) {
      return { label: 'On disk', className: 'status-disk' };
    }
    if (item.success) {
      return { label: 'OK', className: 'status-ok' };
    }
    return { label: 'Failed', className: 'status-fail' };
  }

  function locationFor(item) {
    if (item.systemPath) return item.systemPath;
    if (item.type === 'sent') return 'Browser-selected source file (path unavailable)';
    if (item.type === 'received' && item.filename) {
      return item.fileExists === false
        ? 'Missing from receiver output directory'
        : 'Resolving receiver output path...';
    }
    return '--';
  }

  async function parseJsonSafe(response) {
    try {
      return await response.json();
    } catch {
      return {};
    }
  }

  async function refreshServerFiles({ silent = false } = {}) {
    if (!serverFilesRequest) {
      serverFilesRequest = fetch('/api/receive/files', { cache: 'no-store' })
        .then(async (response) => {
          if (!response.ok) return [];
          const data = await parseJsonSafe(response);
          return Array.isArray(data) ? data : [];
        })
        .catch(() => [])
        .finally(() => {
          serverFilesRequest = null;
        });
    }

    const files = await serverFilesRequest;
    serverFiles = files;
    if (!silent) render();
  }

  function buildViewItems() {
    const localItems = getHistory();
    const filesByName = new Map(
      serverFiles.map((file) => [file.filename, file]),
    );
    const seenNames = new Set();
    const merged = localItems.map((item, localIndex) => {
      const disk = item.type === 'received' && item.filename
        ? filesByName.get(item.filename)
        : null;
      if (disk) seenNames.add(disk.filename);

      return {
        ...item,
        imported: false,
        localIndex,
        size: item.size != null ? item.size : (disk ? disk.size : null),
        systemPath: item.systemPath || (disk ? disk.system_path : ''),
        fileExists: item.type === 'received' && item.filename
          ? Boolean(disk)
          : item.fileExists,
        timestamp: item.timestamp != null
          ? item.timestamp
          : (disk ? disk.modified_ms : Date.now()),
      };
    });

    for (const file of serverFiles) {
      if (seenNames.has(file.filename)) continue;
      merged.push({
        type: 'received',
        filename: file.filename,
        size: file.size,
        duration: null,
        speed: null,
        success: null,
        timestamp: file.modified_ms,
        protocol: 'disk',
        systemPath: file.system_path,
        fileExists: true,
        imported: true,
        localIndex: null,
      });
    }

    return merged.sort((a, b) => Number(b.timestamp || 0) - Number(a.timestamp || 0));
  }

  function findLocalHistoryIndex(item, items) {
    if (Number.isInteger(item.localIndex)) {
      const candidate = items[item.localIndex];
      if (
        candidate &&
        candidate.timestamp === item.timestamp &&
        candidate.filename === item.filename &&
        candidate.type === item.type
      ) {
        return item.localIndex;
      }
    }
    return items.findIndex((entry) => (
      entry.timestamp === item.timestamp &&
      entry.filename === item.filename &&
      entry.type === item.type
    ));
  }

  async function deleteEntry(index) {
    const item = viewItems[index];
    if (!item) return;

    const canDeleteFile = item.type === 'received' && !!item.filename && item.fileExists !== false;
    const hasLocalEntry = Number.isInteger(item.localIndex);
    const label = item.filename || 'this entry';
    const confirmed = await showConfirmModal({
      title: canDeleteFile
        ? 'Delete receiver file'
        : 'Remove history entry',
      message: canDeleteFile
        ? (hasLocalEntry
          ? `Delete "${label}" from disk and remove it from history?`
          : `Delete "${label}" from disk?`)
        : `Remove "${label}" from history?`,
      confirmLabel: canDeleteFile ? 'Delete file' : 'Remove entry',
    });
    if (!confirmed) return;

    if (canDeleteFile) {
      const response = await fetch('/api/receive/file/' + encodeURIComponent(item.filename), {
        method: 'DELETE',
      });
      if (!response.ok && response.status !== 404) {
        const data = await parseJsonSafe(response);
        setNotice(data.error || 'Unable to delete the receiver file.', true);
        return;
      }
    }

    if (hasLocalEntry) {
      const items = getHistory();
      const localIndex = findLocalHistoryIndex(item, items);
      if (localIndex >= 0) {
        items.splice(localIndex, 1);
        setHistory(items);
      }
    }

    if (canDeleteFile) {
      await refreshServerFiles({ silent: true });
    }

    setNotice(
      canDeleteFile
        ? 'Receiver file deleted.'
        : 'History entry removed.',
    );
    render();
  }

  async function openLocation(index) {
    const item = viewItems[index];
    if (!item || item.type !== 'received' || !item.filename) return;

    const response = await fetch('/api/receive/file/' + encodeURIComponent(item.filename) + '/reveal', {
      method: 'POST',
    });
    const data = await parseJsonSafe(response);
    if (!response.ok) {
      setNotice(data.error || 'Unable to open the file location.', true);
      return;
    }

    const openedDirectory = data.opened === 'directory';
    setNotice(openedDirectory ? 'Output folder opened.' : 'File location opened.');
  }

  function render() {
    viewItems = buildViewItems();
    tbody.innerHTML = '';

    if (viewItems.length === 0) {
      table.style.display = 'none';
      emptyState.style.display = '';
      countLabel.textContent = 'No transfers recorded';
      return;
    }

    table.style.display = '';
    emptyState.style.display = 'none';
    countLabel.textContent = viewItems.length + ' item' + (viewItems.length !== 1 ? 's' : '');

    for (const [index, item] of viewItems.entries()) {
      const tr = document.createElement('tr');
      const date = new Date(item.timestamp);
      const dateStr = date.toLocaleDateString('en-US', {
        month: 'short', day: 'numeric', year: 'numeric'
      }) + ' ' + date.toLocaleTimeString('en-US', {
        hour: '2-digit', minute: '2-digit', hour12: false
      });

      const typeClass = item.type === 'sent' ? 'tag-sent' : 'tag-received';
      const status = statusFor(item);
      const canDeleteFile = item.type === 'received' && !!item.filename && item.fileExists !== false;
      const canOpenLocation = item.type === 'received' && !!item.filename && !!item.systemPath;
      const deleteLabel = canDeleteFile ? 'Delete file' : 'Delete entry';
      const location = locationFor(item);
      const protocol = item.imported
        ? 'IMPORTED FROM DISK'
        : (item.protocol ? String(item.protocol).toUpperCase() : '');

      tr.innerHTML = `
        <td>${dateStr}</td>
        <td><span class="tag ${typeClass}">${item.type}</span></td>
        <td>
          <div class="cell-primary">${escapeHtml(item.filename || '--')}</div>
          <div class="cell-sub">${escapeHtml(protocol || 'Protocol unavailable')}</div>
        </td>
        <td class="path-cell"><div class="path-text${item.systemPath ? '' : ' dim'}">${escapeHtml(location)}</div></td>
        <td>${item.size != null ? formatSize(item.size) : '--'}</td>
        <td>${formatDuration(item.duration)}</td>
        <td>${formatSpeed(item.speed)}</td>
        <td><span class="status-badge ${status.className}">${status.label}</span></td>
        <td>
          <div class="row-actions">
            ${canOpenLocation ? `<button class="row-btn row-btn-open" data-action="open" data-index="${index}">Open location</button>` : ''}
            <button class="row-btn row-btn-danger" data-action="delete" data-index="${index}">${deleteLabel}</button>
          </div>
        </td>
      `;
      tbody.appendChild(tr);
    }
  }

  clearBtn.addEventListener('click', () => {
    showConfirmModal({
      title: 'Clear local history',
      message: 'Clear the local history list? Files on disk will not be deleted.',
      confirmLabel: 'Clear history',
    }).then((confirmed) => {
      if (!confirmed) return;
      localStorage.removeItem(STORAGE_KEY);
      setNotice('History cleared.');
      render();
    });
  });

  confirmModalCancel.addEventListener('click', () => closeConfirmModal(false));
  confirmModalConfirm.addEventListener('click', () => closeConfirmModal(true));
  confirmModal.addEventListener('click', (event) => {
    if (event.target === confirmModal) {
      closeConfirmModal(false);
    }
  });
  window.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && confirmState) {
      event.preventDefault();
      closeConfirmModal(false);
    }
  });

  tbody.addEventListener('click', (event) => {
    const btn = event.target.closest('button[data-action]');
    if (!btn) return;
    const index = Number(btn.dataset.index);
    if (!Number.isInteger(index)) return;
    if (btn.dataset.action === 'open') {
      openLocation(index);
      return;
    }
    if (btn.dataset.action === 'delete') {
      deleteEntry(index);
    }
  });

  // Listen for storage events from other tabs (sender/receiver)
  window.addEventListener('storage', (e) => {
    if (e.key === STORAGE_KEY) render();
  });
  window.addEventListener('focus', () => {
    refreshServerFiles({ silent: true }).then(render);
  });

  render();
  refreshServerFiles({ silent: true }).then(render);
  window.setInterval(() => {
    if (document.visibilityState !== 'visible') return;
    refreshServerFiles({ silent: true }).then(render);
  }, 5000);
})();
</script>
</body>
</html>
