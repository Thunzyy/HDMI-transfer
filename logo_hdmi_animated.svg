<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <defs>
    <!-- GLOW FILTERS -->
    <filter id="intense-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#48C2E1" flood-opacity="0.8"/>
    </filter>
    <filter id="glass-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="15" flood-color="#0A1E31" flood-opacity="0.9"/>
    </filter>

    <!-- GRADIENTS -->
    <radialGradient id="hdmiGrad" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#9DEEFF" />
      <stop offset="60%" stop-color="#48C2E1" />
      <stop offset="100%" stop-color="#216189" />
    </radialGradient>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9DEEFF" stop-opacity="0" />
      <stop offset="40%" stop-color="#9DEEFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#48C2E1" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="hologramFlare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#48C2E1" stop-opacity="0.30" />
      <stop offset="30%" stop-color="#216189" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.0" />
    </radialGradient>

    <!-- SHAPES -->
    <path id="hdmi-plug" d="M 130 180 L 370 180 L 370 260 L 310 330 L 190 330 L 130 260 Z" fill="none" stroke-linejoin="round" />
  </defs>

  <!-- BACKGROUND: Ambient Flare -->
  <circle cx="250" cy="250" r="250" fill="url(#hologramFlare)" />

  <!-- BACKGROUND ROTATING TECH DATA RINGS -->
  <g filter="url(#intense-glow)">
    <!-- Outer dashed fast -->
    <circle cx="250" cy="250" r="180" fill="none" stroke="url(#hdmiGrad)" stroke-width="2" stroke-dasharray="8 24" opacity="0.3">
      <animateTransform attributeName="transform" type="rotate" values="0 250 250; 360 250 250" dur="15s" repeatCount="indefinite" />
    </circle>
    <!-- Middle double ring -->
    <circle cx="250" cy="250" r="160" fill="none" stroke="url(#hdmiGrad)" stroke-width="1.5" opacity="0.4" />
    <circle cx="250" cy="250" r="150" fill="none" stroke="url(#hdmiGrad)" stroke-width="3" stroke-dasharray="60 30" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" values="360 250 250; 0 250 250" dur="20s" repeatCount="indefinite" />
    </circle>
    <!-- Inner micro ring -->
    <circle cx="250" cy="250" r="110" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="2 12" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" values="0 250 250; 360 250 250" dur="10s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- ANIMATED DATA STREAMS (HDMI OUTPUT FLUX) -->
  <g filter="url(#intense-glow)">
    <!-- Main fast stream blocks -->
    <rect x="238" y="0" width="24" height="200" fill="url(#streamGrad)">
      <animateTransform attributeName="transform" type="translate" values="0 180; 0 -200" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0; 0.9; 0" dur="1.5s" keyTimes="0; 0.3; 1" repeatCount="indefinite" />
    </rect>
    <rect x="238" y="0" width="24" height="150" fill="url(#streamGrad)">
      <animateTransform attributeName="transform" type="translate" values="0 180; 0 -200" dur="1.5s" begin="0.75s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0; 0.9; 0" dur="1.5s" keyTimes="0; 0.3; 1" begin="0.75s" repeatCount="indefinite" />
    </rect>
    
    <!-- Side thin streams -->
    <rect x="195" y="0" width="6" height="100" fill="url(#streamGrad)">
      <animateTransform attributeName="transform" type="translate" values="0 180; 0 -100" dur="0.9s" begin="0.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0; 0.7; 0" dur="0.9s" keyTimes="0; 0.5; 1" begin="0.2s" repeatCount="indefinite" />
    </rect>
    <rect x="215" y="0" width="10" height="140" fill="url(#streamGrad)">
      <animateTransform attributeName="transform" type="translate" values="0 180; 0 -150" dur="2s" begin="0.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0; 0.5; 0" dur="2s" keyTimes="0; 0.4; 1" begin="0.8s" repeatCount="indefinite" />
    </rect>
    
    <rect x="275" y="0" width="10" height="110" fill="url(#streamGrad)">
      <animateTransform attributeName="transform" type="translate" values="0 180; 0 -130" dur="1.2s" begin="0.1s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0; 0.8; 0" dur="1.2s" keyTimes="0; 0.4; 1" begin="0.1s" repeatCount="indefinite" />
    </rect>
    <rect x="299" y="0" width="6" height="80" fill="url(#streamGrad)">
      <animateTransform attributeName="transform" type="translate" values="0 180; 0 -90" dur="1.1s" begin="0.6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0; 0.6; 0" dur="1.1s" keyTimes="0; 0.5; 1" begin="0.6s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- GIGANTIC HDMI PORT (Foreground Glass Object) -->
  <g filter="url(#glass-glow)">
    <!-- Base dark shadow block beneath -->
    <use href="#hdmi-plug" stroke="#04121F" stroke-width="16" transform="translate(0, 8)" opacity="0.8"/>
  </g>

  <g filter="url(#intense-glow)">
    <!-- Glowing HDMI Silhouette -->
    <use href="#hdmi-plug" stroke="url(#hdmiGrad)" stroke-width="14" />
    
    <!-- Central Horizontal Edge Line -->
    <path d="M 160 230 L 340 230" stroke="url(#hdmiGrad)" stroke-width="8" stroke-linecap="round" />
    
    <!-- Array of Glowing Pins Extruded -->
    <g fill="url(#hdmiGrad)">
      <rect x="180" y="275" width="8" height="20" rx="3" />
      <rect x="200" y="275" width="8" height="20" rx="3" />
      <rect x="220" y="275" width="8" height="20" rx="3" />
      <rect x="240" y="275" width="10" height="22" rx="3" />
      <rect x="262" y="275" width="8" height="20" rx="3" />
      <rect x="282" y="275" width="8" height="20" rx="3" />
      <rect x="302" y="275" width="8" height="20" rx="3" />
    </g>
  </g>
  
  <!-- Subtle HDMI Liquid Glass edge Reflection (gives it volume) -->
  <use href="#hdmi-plug" stroke="#FFFFFF" stroke-width="2" transform="translate(-1.5, -1.5)" opacity="0.5" />
</svg>
