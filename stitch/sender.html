<!DOCTYPE html>

<html class="dark" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>HDMI Exfil : Web Sender Fullscreen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0df2f2",
                        "background-light": "#f5f8f8",
                        "background-dark": "#102222",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"],
                        "mono": ["IBM Plex Mono", "monospace"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .checkerboard-pattern {
            background-color: #000000;
            background-image: linear-gradient(45deg, #1a1a1a 25%, transparent 25%, transparent 75%, #1a1a1a 75%, #1a1a1a),
            linear-gradient(45deg, #1a1a1a 25%, transparent 25%, transparent 75%, #1a1a1a 75%, #1a1a1a);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }
    </style>
</head>
<body class="font-display bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col overflow-hidden m-0 p-0 relative">
<div class="absolute inset-0 checkerboard-pattern z-0 opacity-80" data-alt="Dynamic encoded data pattern background"></div>
<div class="relative z-10 flex h-screen w-full flex-col justify-between">
<header class="flex items-center justify-between whitespace-nowrap bg-background-dark/90 backdrop-blur-md border-b border-primary/20 px-6 py-3 shadow-lg">
<div class="flex items-center gap-4">
<div class="size-6 text-primary flex items-center justify-center">
<span class="material-symbols-outlined text-2xl">cable</span>
</div>
<h2 class="text-white text-xl font-bold leading-tight tracking-tight">HDMI Exfil</h2>
</div>
<div class="flex items-center gap-8">
<div class="flex items-center gap-6 font-mono text-sm">
<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
<span class="text-slate-300 font-medium">SIGNAL : <span class="text-primary">PRÊT</span></span>
</div>
<div class="h-4 w-[1px] bg-slate-700"></div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[16px] text-slate-400">speed</span>
<span class="text-slate-300 font-medium">FPS : <span class="text-white">240</span></span>
</div>
<div class="h-4 w-[1px] bg-slate-700"></div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[16px] text-slate-400">fingerprint</span>
<span class="text-slate-300 font-medium">SHA-256 : <span class="text-white">7f83...a12</span></span>
</div>
</div>
<div class="flex items-center justify-center rounded bg-primary/10 border border-primary/30 h-9 px-4 text-primary font-mono text-sm font-bold tracking-wider">
<span class="material-symbols-outlined text-[18px] mr-2">timer</span>
                    DURÉE : 00:00:00
                </div>
</div>
</header>
<div class="flex-1 flex items-center justify-center p-8 pointer-events-none">
<div class="text-center bg-black/50 p-6 rounded-xl backdrop-blur-sm border border-slate-800">
<span class="material-symbols-outlined text-6xl text-slate-600 mb-4">qr_code_scanner</span>
<p class="font-mono text-slate-400 uppercase tracking-widest text-sm">Canevas de transmission actif</p>
<p class="font-mono text-slate-500 text-xs mt-2">En attente du flux de données...</p>
</div>
</div>
<div class="flex justify-center w-full pb-8 px-6 z-20">
<div class="bg-background-dark/80 backdrop-blur-xl border border-primary/20 rounded-2xl shadow-2xl p-4 flex items-end gap-4 max-w-4xl w-full">
<label class="flex flex-col flex-1">
<p class="text-slate-300 text-xs font-bold uppercase tracking-wider mb-2 ml-1 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">folder_open</span>
                        Fichier source
                    </p>
<div class="relative">
<select class="form-select appearance-none w-full bg-slate-900/50 border border-slate-700 rounded-lg text-white h-12 px-4 py-2 font-mono text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none cursor-pointer">
<option selected="" value="archive_data.bin">archive_data.bin (1.2 GB)</option>
<option value="sys_backup.tar.gz">sys_backup.tar.gz (4.5 GB)</option>
<option value="keys.enc">keys.enc (12 KB)</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</label>
<label class="flex flex-col flex-1">
<p class="text-slate-300 text-xs font-bold uppercase tracking-wider mb-2 ml-1 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">tune</span>
                        Profil d'encodage
                    </p>
<div class="relative">
<select class="form-select appearance-none w-full bg-slate-900/50 border border-slate-700 rounded-lg text-white h-12 px-4 py-2 font-mono text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none cursor-pointer">
<option selected="" value="1080p240">Vitesse - 1080p@240Hz</option>
<option value="4k60">Qualité - 4K@60Hz</option>
<option value="720p120">Furtif - 720p@120Hz</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</label>
<button class="flex items-center justify-center h-12 px-8 rounded-lg bg-primary hover:bg-primary/90 text-background-dark font-bold text-sm tracking-wide transition-all shadow-[0_0_15px_rgba(13,242,242,0.3)] hover:shadow-[0_0_25px_rgba(13,242,242,0.5)] whitespace-nowrap">
<span class="material-symbols-outlined mr-2">play_arrow</span>
                    DÉMARRER TRANSMISSION
                </button>
</div>
</div>
</div>
</body></html>
