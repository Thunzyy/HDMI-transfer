<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HDMI Exfil - Fountain Sender</title>
  <style>
    :root {
      --bg: #050505;
      --panel: rgba(0, 0, 0, 0.78);
      --accent: #00d5ff;
      --text: #e6f9ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at 25% 25%, #0a0a0a, #000);
      color: var(--text);
      font-family: "JetBrains Mono", Consolas, monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #controls {
      position: fixed;
      top: 12px;
      left: 12px;
      background: var(--panel);
      border: 1px solid var(--accent);
      padding: 10px 12px;
      z-index: 10;
      transition: opacity 0.3s ease;
    }
    #controls.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #controls h1 {
      margin: 0 0 8px 0;
      font-size: 16px;
      color: var(--accent);
      letter-spacing: 0.5px;
    }
    #controls label, #controls button, #controls small {
      font-size: 13px;
      display: block;
      margin-bottom: 6px;
    }
    #controls input[type="file"] {
      color: var(--text);
      width: 240px;
    }
    #controls button {
      cursor: pointer;
      background: var(--accent);
      color: #000;
      border: none;
      padding: 6px 10px;
      font-weight: bold;
      margin-right: 6px;
    }
    #controls button:disabled {
      background: #444;
      color: #999;
      cursor: not-allowed;
    }
    #status { margin-top: 6px; }
    #stats { color: #9fe870; margin-top: 2px; }
    #hint { margin-top: 8px; color: #f5d67b; }
    canvas {
      display: block;
      width: 1920px;
      height: 1080px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #000;
    }
  </style>
</head>
<body>
  <div id="controls">
    <h1>Fountain Sender (HDMI)</h1>
    <label>Fichier a envoyer
      <input type="file" id="fileInput" />
    </label>
    <div>
      <button id="startBtn" disabled>Demarrer</button>
      <button id="stopBtn" disabled>Arreter</button>
      <button id="toggleUiBtn">Afficher/Masquer UI (H)</button>
    </div>
    <div id="status">Charge un fichier pour armer l'envoi.</div>
    <div id="stats"></div>
    <div id="hint">F11 pour plein ecran. Cache l'UI pendant l'envoi pour ne pas polluer l'image.</div>
  </div>

  <canvas id="canvas" width="1920" height="1080"></canvas>

  <script>
    (() => {
      // Parametres partages avec receiver_fountain.py
      const WIDTH = 1920;
      const HEIGHT = 1080;
      const BLOCK_SIZE = 8;
      const COLS = WIDTH / BLOCK_SIZE;
      const ROWS = HEIGHT / BLOCK_SIZE;
      const BITS_PER_FRAME = ROWS * COLS; // 32400
      const BYTES_PER_FRAME = BITS_PER_FRAME / 8; // 4050
      const HEADER_LEN = 6; // seed (4) + K (2)
      const PAYLOAD_SIZE = BYTES_PER_FRAME - HEADER_LEN; // 4044

      const BLACK = 0xff000000;
      const WHITE = 0xffffffff;

      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d", { alpha: false });
      ctx.imageSmoothingEnabled = false;

      const imageData = ctx.createImageData(WIDTH, HEIGHT);
      const buf = new Uint32Array(imageData.data.buffer);

      const controls = document.getElementById("controls");
      const fileInput = document.getElementById("fileInput");
      const startBtn = document.getElementById("startBtn");
      const stopBtn = document.getElementById("stopBtn");
      const toggleUiBtn = document.getElementById("toggleUiBtn");
      const statusEl = document.getElementById("status");
      const statsEl = document.getElementById("stats");

      const textEncoder = new TextEncoder();

      const state = {
        chunks: [],
        K: 0,
        seed: 1,
        frame: 0,
        running: false,
        bits: new Uint8Array(BITS_PER_FRAME),
        raf: null
      };

      function setStatus(msg) {
        statusEl.textContent = msg;
      }

      function updateStats() {
        statsEl.textContent = `Frames envoyes: ${state.frame} | Seed: ${state.seed} | K: ${state.K} | Chunk: ${PAYLOAD_SIZE} o`;
      }

      function wrapWithMetadata(file, rawBytes) {
        const nameBytes = textEncoder.encode((file && file.name) || "payload.bin");
        const total = 4 + nameBytes.length + rawBytes.length;
        const out = new Uint8Array(total);
        const view = new DataView(out.buffer);
        view.setUint32(0, nameBytes.length, false);
        out.set(nameBytes, 4);
        out.set(rawBytes, 4 + nameBytes.length);
        return out;
      }

      function sliceIntoChunks(bytes) {
        const K = Math.ceil(bytes.length / PAYLOAD_SIZE);
        const chunks = new Array(K);
        for (let i = 0; i < K; i++) {
          const start = i * PAYLOAD_SIZE;
          const end = Math.min(start + PAYLOAD_SIZE, bytes.length);
          const chunk = new Uint8Array(PAYLOAD_SIZE);
          chunk.set(bytes.subarray(start, end));
          chunks[i] = chunk;
        }
        return { K, chunks };
      }

      // SplitMix32 PRNG (meme algo que receiver_fountain.py)
      function createPRNG(seed) {
        let a = seed >>> 0;
        return () => {
          a = (a + 0x9e3779b9) >>> 0;
          let t = a ^ (a >>> 16);
          t = Math.imul(t, 0x21f0aaad) >>> 0;
          t ^= t >>> 15;
          t = Math.imul(t, 0x735a2d97) >>> 0;
          t ^= t >>> 15;
          return t >>> 0;
        };
      }

      function chooseIndices(seed, K) {
        const next = createPRNG(seed);
        const degreeRand = next() / 0x100000000;
        let degree = 1;
        if (degreeRand < 0.1) degree = 1;
        else if (degreeRand < 0.6) degree = 2;
        else degree = Math.floor((next() / 0x100000000) * Math.min(K, 20)) + 1;

        const indices = new Set();
        while (indices.size < degree) {
          indices.add(next() % K);
        }
        return Array.from(indices);
      }

      function buildDroplet(seed) {
        const idxs = chooseIndices(seed, state.K);
        const payload = new Uint8Array(PAYLOAD_SIZE);
        for (const idx of idxs) {
          const chunk = state.chunks[idx];
          for (let i = 0; i < PAYLOAD_SIZE; i++) {
            payload[i] ^= chunk[i];
          }
        }
        return payload;
      }

      function bytesToBits(bytes) {
        let bitPos = 0;
        for (let i = 0; i < bytes.length; i++) {
          const byte = bytes[i];
          state.bits[bitPos++] = (byte >> 7) & 1;
          state.bits[bitPos++] = (byte >> 6) & 1;
          state.bits[bitPos++] = (byte >> 5) & 1;
          state.bits[bitPos++] = (byte >> 4) & 1;
          state.bits[bitPos++] = (byte >> 3) & 1;
          state.bits[bitPos++] = (byte >> 2) & 1;
          state.bits[bitPos++] = (byte >> 1) & 1;
          state.bits[bitPos++] = byte & 1;
        }
      }

      function drawBits(bits) {
        let bitIdx = 0;
        for (let r = 0; r < ROWS; r++) {
          const startY = r * BLOCK_SIZE;
          for (let c = 0; c < COLS; c++) {
            const color = bits[bitIdx++] ? WHITE : BLACK;
            const startX = c * BLOCK_SIZE;
            for (let y = 0; y < BLOCK_SIZE; y++) {
              const rowOffset = (startY + y) * WIDTH + startX;
              buf.fill(color, rowOffset, rowOffset + BLOCK_SIZE);
            }
          }
        }
        ctx.putImageData(imageData, 0, 0);
      }

      function stopSending() {
        state.running = false;
        if (state.raf) cancelAnimationFrame(state.raf);
        controls.classList.remove("hidden");
        startBtn.disabled = !state.chunks.length;
        stopBtn.disabled = true;
        setStatus("Envoi arrete.");
      }

      function renderLoop() {
        if (!state.running) return;

        const seed = state.seed >>> 0;
        const payload = buildDroplet(seed);
        const frameBytes = new Uint8Array(BYTES_PER_FRAME);
        const view = new DataView(frameBytes.buffer);
        view.setUint32(0, seed, false);
        view.setUint16(4, state.K, false);
        frameBytes.set(payload, HEADER_LEN);

        bytesToBits(frameBytes);
        drawBits(state.bits);

        state.seed = (state.seed + 1) >>> 0;
        if (state.seed === 0) state.seed = 1; // evite seed nul
        state.frame += 1;
        if (state.frame % 30 === 0) updateStats();

        state.raf = requestAnimationFrame(renderLoop);
      }

      // Gestion des evenements
      fileInput.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = () => {
          const raw = new Uint8Array(reader.result);
          const wrapped = wrapWithMetadata(file, raw);
          const { K, chunks } = sliceIntoChunks(wrapped);
          state.chunks = chunks;
          state.K = K;
          state.seed = 1;
          state.frame = 0;
          startBtn.disabled = false;
          stopBtn.disabled = true;
          setStatus(`Pret: ${file.name} (${raw.length} o). K=${K}, chunk=${PAYLOAD_SIZE} o.`);
          updateStats();
        };
        reader.readAsArrayBuffer(file);
      });

      startBtn.addEventListener("click", () => {
        if (!state.chunks.length) return;
        state.running = true;
        state.seed = 1;
        state.frame = 0;
        startBtn.disabled = true;
        stopBtn.disabled = false;
        controls.classList.add("hidden"); // evite d'ecrire sur le canvas
        setStatus("Envoi en cours... (Espace pour pause)");
        renderLoop();
      });

      stopBtn.addEventListener("click", stopSending);

      toggleUiBtn.addEventListener("click", () => {
        controls.classList.toggle("hidden");
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === " ") {
          e.preventDefault();
          if (state.running) {
            stopSending();
          } else if (state.chunks.length) {
            startBtn.click();
          }
        } else if (e.key.toLowerCase() === "h") {
          controls.classList.toggle("hidden");
        }
      });

      // Premiere image noire
      drawBits(new Uint8Array(BITS_PER_FRAME));
      setStatus("Charge un fichier pour armer l'envoi.");
      updateStats();
    })();
  </script>
</body>
</html>
