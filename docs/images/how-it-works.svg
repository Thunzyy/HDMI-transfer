<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title description">
  <title id="title">How HDMI Transfer works</title>
  <desc id="description">A sender PC encodes a file into video frames. An HDMI cable carries those frames to a capture card, which sends the captured video over USB to a receiver PC. The receiver decodes the frames and reconstructs the file. No shared network is required for the file payload.</desc>
  <style>
    /* One illustrative transfer every six seconds; no scripts or external assets. */
    .pixel { animation: pixels 3.2s steps(1, end) infinite; }
    .packet { opacity: 0; }
    .hdmi { animation: hdmi 6s linear infinite; }
    .usb { animation: usb 6s linear infinite; }
    .second { animation-delay: .24s; }
    .third { animation-delay: .48s; }
    .capture { animation: capture 6s ease-in-out infinite; }
    .progress { stroke-dasharray: 164; animation: rebuild 6s ease-in-out infinite; }
    .complete { animation: complete 6s ease-in-out infinite; }
    @keyframes pixels {
      0%, 100% { fill: #69c3d5; }
      12.5% { fill: #687cc6; }
      25% { fill: #4da9ba; }
      37.5% { fill: #8198d0; }
      50% { fill: #5a799c; }
      62.5% { fill: #77b6c4; }
      75% { fill: #737cb6; }
      87.5% { fill: #519bb9; }
    }
    @keyframes hdmi {
      0%, 8% { opacity: 0; transform: translateX(0); }
      10% { opacity: 1; transform: translateX(0); }
      35% { opacity: 1; transform: translateX(110px); }
      37%, 100% { opacity: 0; transform: translateX(110px); }
    }
    @keyframes capture {
      0%, 25%, 65%, 100% { stroke: #637087; }
      35%, 50% { stroke: #69d5e8; }
    }
    @keyframes usb {
      0%, 44% { opacity: 0; transform: translateX(0); }
      46% { opacity: 1; transform: translateX(0); }
      71% { opacity: 1; transform: translateX(108px); }
      73%, 100% { opacity: 0; transform: translateX(108px); }
    }
    @keyframes rebuild {
      0%, 48% { stroke-dashoffset: 164; }
      80%, 95% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }
    @keyframes complete {
      0%, 73% { opacity: .15; }
      83%, 95% { opacity: 1; }
      100% { opacity: .15; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pixel, .packet, .capture, .progress, .complete { animation: none; }
    }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#69d5e8" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1200" height="440" rx="18" fill="#0f1117"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="40" y="48" fill="#f4f5f7" font-size="26" font-weight="700">One file. A video signal. Another computer.</text>
    <text x="40" y="78" fill="#a9b1c0" font-size="17">Follow the data from the sender to the receiver.</text>

    <g stroke="#637087" stroke-width="2" fill="#191d27">
      <rect x="65" y="123" width="260" height="156" rx="9"/>
      <path d="M175 279v20h-45m85-20v20h45M130 300h130" fill="none"/>
      <g id="sender-pixels" stroke="none" aria-hidden="true">
        <rect x="82" y="139" width="226" height="122" rx="3" fill="#182a3d"/>
        <path class="pixel" style="animation-delay: -0.0s" fill="#69c3d5" d="M238 144h13v13h-13zM280 144h13v13h-13zM126 158h13v13h-13zM238 158h13v13h-13zM126 172h13v13h-13zM154 172h13v13h-13zM196 186h13v13h-13zM84 200h13v13h-13zM98 200h13v13h-13zM154 200h13v13h-13zM224 200h13v13h-13zM294 200h13v13h-13zM182 214h13v13h-13zM224 214h13v13h-13zM98 228h13v13h-13zM266 228h13v13h-13zM98 242h13v13h-13zM112 242h13v13h-13zM154 242h13v13h-13zM280 242h13v13h-13z"/>
        <path class="pixel" style="animation-delay: -0.4s" fill="#687cc6" d="M224 158h13v13h-13zM252 158h13v13h-13zM280 158h13v13h-13zM252 172h13v13h-13zM84 186h13v13h-13zM224 186h13v13h-13zM196 200h13v13h-13zM266 200h13v13h-13zM280 200h13v13h-13zM154 214h13v13h-13zM252 214h13v13h-13zM126 228h13v13h-13zM294 228h13v13h-13zM266 242h13v13h-13z"/>
        <path class="pixel" style="animation-delay: -0.8s" fill="#4da9ba" d="M168 144h13v13h-13zM98 158h13v13h-13zM154 158h13v13h-13zM294 158h13v13h-13zM112 172h13v13h-13zM210 172h13v13h-13zM294 172h13v13h-13zM84 214h13v13h-13zM168 214h13v13h-13zM294 214h13v13h-13zM112 228h13v13h-13zM196 228h13v13h-13zM280 228h13v13h-13zM182 242h13v13h-13zM238 242h13v13h-13zM252 242h13v13h-13z"/>
        <path class="pixel" style="animation-delay: -1.2s" fill="#8198d0" d="M112 144h13v13h-13zM84 158h13v13h-13zM168 158h13v13h-13zM266 158h13v13h-13zM140 172h13v13h-13zM98 186h13v13h-13zM112 186h13v13h-13zM168 200h13v13h-13zM252 200h13v13h-13zM196 214h13v13h-13zM280 214h13v13h-13zM84 228h13v13h-13zM140 228h13v13h-13zM238 228h13v13h-13z"/>
        <path class="pixel" style="animation-delay: -1.6s" fill="#5a799c" d="M84 144h13v13h-13zM98 172h13v13h-13zM210 186h13v13h-13zM280 186h13v13h-13zM294 186h13v13h-13zM210 200h13v13h-13zM238 200h13v13h-13zM126 214h13v13h-13zM210 214h13v13h-13zM154 228h13v13h-13zM182 228h13v13h-13zM224 228h13v13h-13z"/>
        <path class="pixel" style="animation-delay: -2.0s" fill="#77b6c4" d="M98 144h13v13h-13zM126 144h13v13h-13zM140 144h13v13h-13zM154 144h13v13h-13zM182 144h13v13h-13zM196 144h13v13h-13zM252 144h13v13h-13zM294 144h13v13h-13zM196 158h13v13h-13zM210 158h13v13h-13zM168 172h13v13h-13zM182 186h13v13h-13zM238 186h13v13h-13zM252 186h13v13h-13zM112 200h13v13h-13zM98 214h13v13h-13zM112 214h13v13h-13zM196 242h13v13h-13zM210 242h13v13h-13z"/>
        <path class="pixel" style="animation-delay: -2.4s" fill="#737cb6" d="M182 158h13v13h-13zM182 172h13v13h-13zM224 172h13v13h-13zM238 172h13v13h-13zM280 172h13v13h-13zM126 186h13v13h-13zM140 186h13v13h-13zM154 186h13v13h-13zM168 186h13v13h-13zM182 200h13v13h-13zM140 214h13v13h-13zM238 214h13v13h-13zM168 228h13v13h-13zM210 228h13v13h-13zM252 228h13v13h-13zM84 242h13v13h-13zM126 242h13v13h-13zM168 242h13v13h-13zM224 242h13v13h-13z"/>
        <path class="pixel" style="animation-delay: -2.8s" fill="#519bb9" d="M210 144h13v13h-13zM224 144h13v13h-13zM266 144h13v13h-13zM112 158h13v13h-13zM140 158h13v13h-13zM84 172h13v13h-13zM196 172h13v13h-13zM266 172h13v13h-13zM266 186h13v13h-13zM126 200h13v13h-13zM140 200h13v13h-13zM266 214h13v13h-13zM140 242h13v13h-13zM294 242h13v13h-13z"/>
      </g>
      <rect class="capture" x="495" y="171" width="210" height="83" rx="14"/>
      <path d="M495 196h-10v33h10m210-27h12v22h-12"/>
      <rect x="875" y="123" width="260" height="156" rx="9"/>
      <path d="M985 279v20h-45m85-20v20h45M940 300h130" fill="none"/>
    </g>

    <g fill="none" stroke="#69d5e8" stroke-width="3" marker-end="url(#arrow)">
      <path d="M341 213h127"/>
      <path d="M733 213h125"/>
    </g>
    <g fill="#f4f5f7" stroke="#0f1117" stroke-width="2" aria-hidden="true">
      <circle class="packet hdmi" cx="346" cy="213" r="5"/>
      <circle class="packet hdmi second" cx="346" cy="213" r="5"/>
      <circle class="packet hdmi third" cx="346" cy="213" r="5"/>
      <circle class="packet usb" cx="738" cy="213" r="5"/>
      <circle class="packet usb second" cx="738" cy="213" r="5"/>
      <circle class="packet usb third" cx="738" cy="213" r="5"/>
    </g>
    <g text-anchor="middle" font-size="17" font-weight="600" fill="#69d5e8">
      <text x="403" y="175">HDMI cable</text>
      <text x="796" y="175">USB</text>
    </g>
    <g text-anchor="middle" fill="#a9b1c0" font-size="14">
      <text x="403" y="254">Video output</text>
      <text x="796" y="254">Captured video</text>
    </g>
    <text x="600" y="206" fill="#f4f5f7" text-anchor="middle" font-size="18" font-weight="600">CAPTURE CARD</text>
    <text x="600" y="232" fill="#a9b1c0" text-anchor="middle" font-size="16">HDMI in → USB out</text>

    <path d="M981 149h34l22 22v72h-56z" fill="#252c40" stroke="#8b9bf4" stroke-width="2"/>
    <path d="M1015 149v23h22M993 190h30M993 201h30M993 212h20" fill="none" stroke="#8b9bf4" stroke-width="2"/>
    <path d="M923 261h164" stroke="#30394c" stroke-width="4" stroke-linecap="round"/>
    <path class="progress" d="M923 261h164" stroke="#69d5e8" stroke-width="4" stroke-linecap="round"/>
    <g class="complete">
      <circle cx="1042" cy="235" r="16" fill="#69d5e8"/>
      <path d="m1035 235 5 5 9-10" fill="none" stroke="#0f1117" stroke-width="3"/>
    </g>

    <g text-anchor="middle">
      <g fill="#f4f5f7" font-size="22" font-weight="700">
        <text x="195" y="337">1. Sender PC</text>
        <text x="600" y="337">2. Capture card</text>
        <text x="1005" y="337">3. Receiver PC</text>
      </g>
      <g fill="#a9b1c0" font-size="18">
        <text x="195" y="367">Encode file → video frames</text>
        <text x="600" y="367">Capture the HDMI signal</text>
        <text x="1005" y="367">Decode frames → original file</text>
      </g>
    </g>
    <path d="M40 391h1120" stroke="#2b3140"/>
    <text x="600" y="420" text-anchor="middle" fill="#a9b1c0" font-size="16">File payload travels over HDMI and USB. No shared network required.</text>
  </g>
</svg>
