[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hdmi-exfil"
version = "0.1.0"
description = "Maximum throughput data transfer over HDMI signal encoding"
requires-python = ">= 3.11"
readme = "README.md"
dependencies = [
    "numpy >= 1.24",
    "numba >= 0.60.0",
]

[project.optional-dependencies]
sender = [
    "pygame-ce >= 2.5.0",
    "screeninfo >= 0.8",
    "InquirerPy >= 0.3.4",
]
receiver = [
    "opencv-python >= 4.0",
    "InquirerPy >= 0.3.4",
]
web = [
    "flask>=3.0",
    "opencv-python>=4.0",
]
all = [
    "pygame-ce >= 2.5.0",
    "screeninfo >= 0.8",
    "InquirerPy >= 0.3.4",
    "opencv-python >= 4.0",
    "flask>=3.0",
]
dev = [
    "pygame-ce >= 2.5.0",
    "screeninfo >= 0.8",
    "InquirerPy >= 0.3.4",
    "opencv-python >= 4.0",
    "flask>=3.0",
    "pytest >= 8.0",
    "hypothesis >= 6.0",
    "requests >= 2.32",
    "selenium >= 4.0",
]

[project.scripts]
hdmi-send = "hdmi_exfil.interfaces.cli.send:main"
hdmi-recv = "hdmi_exfil.interfaces.cli.receive:main"
hdmi-calibrate = "hdmi_exfil.interfaces.cli.calibrate:main"
hdmi-bench = "hdmi_exfil.cli.benchmark:main"
hdmi-sender = "hdmi_exfil.interfaces.cli.sender_console:main"
hdmi-receiver = "hdmi_exfil.interfaces.cli.receiver_console:main"
hdmi-web = "hdmi_exfil.web.__main__:main"

[tool.setuptools]
packages = [
    "hdmi_exfil",
    "hdmi_exfil.adapters",
    "hdmi_exfil.adapters.capture",
    "hdmi_exfil.application",
    "hdmi_exfil.capture",
    "hdmi_exfil.cli",
    "hdmi_exfil.compat",
    "hdmi_exfil.core",
    "hdmi_exfil.core.capture",
    "hdmi_exfil.core.cli",
    "hdmi_exfil.core.file_handling",
    "hdmi_exfil.core.protocols",
    "hdmi_exfil.display",
    "hdmi_exfil.domain",
    "hdmi_exfil.file_handling",
    "hdmi_exfil.interfaces",
    "hdmi_exfil.interfaces.browser_sender",
    "hdmi_exfil.interfaces.cli",
    "hdmi_exfil.interfaces.web",
    "hdmi_exfil.protocols",
    "hdmi_exfil.receiver",
    "hdmi_exfil.receiver.capture",
    "hdmi_exfil.receiver.cli",
    "hdmi_exfil.sender",
    "hdmi_exfil.sender.cli",
    "hdmi_exfil.sender.display",
    "hdmi_exfil.web",
]

[tool.setuptools.package-dir]
"hdmi_exfil" = "src"

[tool.setuptools.package-data]
"hdmi_exfil.core" = ["constants.json"]
"hdmi_exfil.interfaces.browser_sender" = ["*.html", "*.js"]
"hdmi_exfil.web" = ["static/*.html", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-v", "--import-mode=importlib", "-p", "no:xonsh"]
markers = [
    "hardware: marks tests requiring Elgato capture card (deselect with '-m \"not hardware\"')",
    "slow: marks tests that take >10s (deselect with '-k \"not slow\"')",
]
