[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hdmi-exfil"
version = "0.1.0"
description = "Maximum throughput data transfer over HDMI signal encoding"
requires-python = ">= 3.11"
dependencies = [
    "numpy >= 1.24",
    "numba >= 0.60.0",
]

[project.optional-dependencies]
sender = [
    "pygame-ce >= 2.5.0",
    "screeninfo >= 0.8",
    "InquirerPy >= 0.3.4",
]
receiver = [
    "opencv-python >= 4.0",
    "InquirerPy >= 0.3.4",
]
web = [
    "flask>=3.0",
    "opencv-python>=4.0",
]
all = [
    "hdmi-exfil[sender]",
    "hdmi-exfil[receiver]",
    "hdmi-exfil[web]",
]
dev = [
    "hdmi-exfil[all]",
    "pytest >= 8.0",
    "hypothesis >= 6.0",
]

[project.scripts]
hdmi-send = "hdmi_exfil.cli.send:main"
hdmi-recv = "hdmi_exfil.cli.receive:main"
hdmi-calibrate = "hdmi_exfil.cli.calibrate:main"
hdmi-bench = "hdmi_exfil.cli.benchmark:main"
hdmi-sender = "hdmi_exfil.sender.cli.console:main"
hdmi-receiver = "hdmi_exfil.receiver.cli.console:main"
hdmi-web = "hdmi_exfil.web.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hdmi_exfil.core" = ["constants.json"]
"hdmi_exfil.web" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-v", "--import-mode=importlib"]
markers = [
    "hardware: marks tests requiring Elgato capture card (deselect with '-m \"not hardware\"')",
    "slow: marks tests that take >10s (deselect with '-k \"not slow\"')",
]
